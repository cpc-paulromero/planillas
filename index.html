<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planillas Perú – Sueldos y Beneficios</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#1d2330;--muted:#667085;--line:#e3e6ec;
  --pri:#1f5fbf;--pri-soft:#e8f0fc;--ok:#13795b;--ok-soft:#e5f5ee;--warn:#a15c00;--warn-soft:#fff4e0;--bad:#b42318;--bad-soft:#fdecea;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151b;--card:#1b2029;--ink:#e7eaf0;--muted:#98a2b3;--line:#2c3340;--pri:#6ea2ff;--pri-soft:#1e2b44;--ok:#4cc79a;--ok-soft:#163128;--warn:#f0b35a;--warn-soft:#3a2c15;--bad:#ff8a80;--bad-soft:#3d1f1d}
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .sub{color:var(--muted);font-size:12px}
#sync{font-size:12px;color:var(--muted)}
#hdr select{font-weight:600;max-width:320px}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok);font-weight:600;cursor:pointer;border:0}
nav{display:flex;gap:4px;padding:8px 20px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
main{padding:20px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 4px}
.card h3{font-size:14px;margin:16px 0 8px}
.hint{color:var(--muted);font-size:12px;margin:0 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px}
input[type=checkbox]{width:16px;height:16px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:7px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;background:var(--bg);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--bg)}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;background:var(--pri-soft);color:var(--pri);font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.note{padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:12px;margin:8px 0}
.note.info{background:var(--pri-soft);color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:10}
#ov.on{display:flex}
#dlg{background:var(--card);border-radius:12px;max-width:960px;width:100%;padding:20px;border:1px solid var(--line)}
#dlg h2{margin:0 0 12px;font-size:17px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 12px}
legend{font-size:12px;font-weight:700;padding:0 6px;color:var(--pri)}
.err{color:var(--bad);font-size:12px}
.boleta{font-size:13px}
.boleta table td{padding:4px 6px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
.rep .adm{display:none!important}
#login,#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:400px}
.lcard h1{margin:0 0 6px;font-size:22px}.lcard form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
#who{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="boot"><div class="lcard"><h1>Planillas Perú</h1><p class="hint">Cargando…</p></div></div>
<div id="login" style="display:none"><div class="lcard"><h1>Planillas Perú</h1>
  <p class="hint">Representante legal: ingresa con el <b>RUC</b> de tu empresa.<br>Administrador: ingresa con tu <b>correo</b>.</p>
  <form onsubmit="doLogin(event)"><label>RUC o correo<input id="lu" autocomplete="username" required></label>
  <label>Contraseña<input id="lp" type="password" autocomplete="current-password" required></label>
  <div id="lerr" class="err"></div><button class="btn pri" id="lbtn">Ingresar</button></form></div></div>
<div id="app" style="display:none">
<header>
  <div><h1>Planillas Perú</h1><div class="sub">Cálculo de sueldos, aportes y beneficios sociales por régimen laboral</div></div>
  <div id="hdr" class="row" style="margin-left:auto;align-items:center"></div>
  <div id="sync"></div>
  <div class="row" style="align-items:center"><span id="who"></span><button class="btn sm" onclick="go('cuenta')">Mi cuenta</button><button class="btn sm" onclick="logout()">Cerrar sesión</button></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="ov"><div id="dlg"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   DATOS POR DEFECTO (todos editables desde la app)
   ========================================================= */
const DEF = {
  config:{
    rmvHist:[{desde:"2025-01-01",monto:1130},{desde:"2026-10-01",monto:1230}], // historial RMV por vigencia
    uit:5500,
    essalud:9, onp:13,
    sisAporte:15,          // aporte mensual del empleador al SIS (microempresa)
    rma:12234.33,          // remuneración máxima asegurable (tope prima de seguros AFP)
    bonifExtra:9,          // bonificación extraordinaria Ley 30334 (9% EsSalud / 6.75% EPS)
    vidaLeyTasa:0,         // % aprox. prima Vida Ley (según póliza)
    sctrTasa:0,            // % aprox. SCTR (según póliza)
    regimenes:[
      {id:"MICRO",nombre:"Microempresa",ventasUIT:150,vacDias:15,gratiFactor:0,ctsFactor:0,indemRD:10,indemTope:90,indemFraccion:false,salud:"SIS_O_ESSALUD",vidaLey:false,sctr:false,
       notas:"Ventas anuales ≤ 150 UIT. RMV mínima. Descanso semanal 24 h. Vacaciones 15 días. Feriados del régimen común. SIS o EsSalud. Indemnización: 10 RD por año completo, tope 90 RD."},
      {id:"PEQUENA",nombre:"Pequeña empresa",ventasUIT:1700,vacDias:15,gratiFactor:0.5,ctsFactor:0.5,indemRD:20,indemTope:120,indemFraccion:false,salud:"ESSALUD",vidaLey:true,sctr:true,
       notas:"Ventas anuales ≤ 1700 UIT. RMV mínima. Vacaciones 15 días. EsSalud contributivo. CTS 15 RD por año (tope 90 RD). Gratificación de 1/2 sueldo (jul/dic). SCTR si hay alto riesgo. Vida Ley. Licencias. Indemnización: 20 RD por año completo, tope 120 RD."},
      {id:"DL728",nombre:"D.L. 728 – Mediana y gran empresa",ventasUIT:null,vacDias:30,gratiFactor:1,ctsFactor:1,indemRD:45,indemTope:360,indemFraccion:true,salud:"ESSALUD",vidaLey:true,sctr:true,
       notas:"Régimen general. Vacaciones 30 días. EsSalud. CTS: 1 remuneración computable por año (RC = sueldo + 1/6 gratificación) / 12 × meses. 2 gratificaciones (jul/dic). SCTR si hay alto riesgo. Vida Ley. Licencias. Indemnización: 1.5 sueldos por año (45 RD), tope 12 sueldos."}
    ]
  },
  afps:[
    {id:"HABITAT",nombre:"AFP Habitat",comision:1.47,comisionSaldo:1.25,prima:1.37,aporte:10},
    {id:"INTEGRA",nombre:"AFP Integra",comision:1.55,comisionSaldo:0.78,prima:1.37,aporte:10},
    {id:"PRIMA",nombre:"Prima AFP",comision:1.60,comisionSaldo:1.25,prima:1.37,aporte:10},
    {id:"PROFUTURO",nombre:"Profuturo AFP",comision:1.69,comisionSaldo:0.68,prima:1.37,aporte:10}
  ],
  conceptos:[
    {id:"ASIGFAM",nombre:"Asignación familiar",tipo:"ingreso",modo:"porc_rmv",valor:10,afectoEssalud:true,afectoPension:true,computable:true,sistema:true}
  ],
  empresas:[],
  trabajadores:[],
  periodos:{}
};
const BANCOS=["BCP – Banco de Crédito","BBVA","Interbank","Scotiabank","Banco de la Nación","BanBif","Banco Pichincha","Mibanco","Banco GNB","Banco Falabella","Banco Ripley","Caja Arequipa","Caja Huancayo","Caja Piura","Otro"];
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

/* =========================================================
   ESTADO Y PERSISTENCIA
   ========================================================= */
const KEYS=["config","afps","conceptos","empresas","trabajadores","periodos"];
const clone=o=>JSON.parse(JSON.stringify(o));
let S=clone(DEF);
const LS="planillas-pe-v1";
/* ---------- Conexión con Supabase ---------- */
const REP_DOMAIN="empresa.planillas.pe";           // debe coincidir con public.rep_email() en supabase.sql
const CFG=window.PLANILLAS_CONFIG||{};
let sb=null, ROLE=null, ME=null, MYEMP=null, REPS=new Set();
const isAdmin=()=>ROLE==="admin";
const timers={}; let chainP=Promise.resolve();
function setSync(t){const e=document.getElementById("sync");if(e)e.textContent=t}
/** Encola las escrituras para que se ejecuten una a una y en orden */
function q(fn){
  chainP=chainP.then(async()=>{setSync("Guardando…");const r=await fn();if(r&&r.error){setSync("⚠ Error al guardar");toast("No se pudo guardar: "+r.error.message);return}setSync("✓ Guardado")}).catch(e=>{setSync("⚠ Error al guardar");toast("No se pudo guardar: "+(e.message||e))});
  return chainP;
}
const empRow=e=>({id:e.id,ruc:e.ruc,razon:e.razon,direccion:e.direccion||"",regimen_id:e.regimenId});
const trabRow=w=>({id:w.id,empresa_id:w.empresaId,data:w,updated_at:new Date().toISOString()});
function perRows(per){
  const out={};
  Object.entries(S.periodos[per]||{}).forEach(([wid,p])=>{const w=S.trabajadores.find(x=>x.id===wid);if(!w)return;(out[w.empresaId]=out[w.empresaId]||{})[wid]=p});
  return Object.entries(out).map(([empresa_id,data])=>({empresa_id,periodo:per,data}));
}
function persist(k,item){
  if(!isAdmin()||!sb)return;
  const key=k+(item?":"+item.id:"");
  clearTimeout(timers[key]);
  timers[key]=setTimeout(()=>{
    if(["config","afps","conceptos"].includes(k))q(()=>sb.from("ajustes").upsert({clave:k,data:S[k]}));
    else if(k==="empresas")q(()=>sb.from("empresas").upsert(S.empresas.map(empRow)));
    else if(k==="trabajadores"){const list=item?[item]:S.trabajadores;if(list.length)q(()=>sb.from("trabajadores").upsert(list.map(trabRow)))}
    else if(k==="periodos"){const rows=perRows(perSel);if(rows.length)q(()=>sb.from("periodos").upsert(rows))}
  },k==="empresas"?0:400);
}
function dbDel(table,col,val){if(isAdmin())q(()=>sb.from(table).delete().eq(col,val))}
async function saveAll(){
  if(!isAdmin())return;
  for(const k of ["config","afps","conceptos"])await q(()=>sb.from("ajustes").upsert({clave:k,data:S[k]}));
  if(S.empresas.length)await q(()=>sb.from("empresas").upsert(S.empresas.map(empRow)));
  if(S.trabajadores.length)await q(()=>sb.from("trabajadores").upsert(S.trabajadores.map(trabRow)));
  const pers=Object.keys(S.periodos).flatMap(perRows);
  if(pers.length)await q(()=>sb.from("periodos").upsert(pers));
}
async function loadAll(){
  setSync("Cargando…");
  const res=await Promise.all(["ajustes","empresas","trabajadores","periodos"].map(t=>sb.from(t).select("*")));
  const bad=res.find(r=>r.error);if(bad)throw bad.error;
  const[aj,em,tr,pe]=res.map(r=>r.data||[]);
  S=clone(DEF);
  aj.forEach(r=>{S[r.clave]=r.data});
  S.empresas=em.map(r=>({id:r.id,ruc:r.ruc,razon:r.razon,direccion:r.direccion,regimenId:r.regimen_id})).sort((a,b)=>a.razon.localeCompare(b.razon));
  S.trabajadores=tr.map(r=>({...r.data,id:r.id,empresaId:r.empresa_id})).sort((a,b)=>nombreT(a).localeCompare(nombreT(b)));
  S.periodos={};pe.forEach(r=>{S.periodos[r.periodo]=Object.assign(S.periodos[r.periodo]||{},r.data)});
  const before=JSON.stringify(S);migrate();
  if(isAdmin()){
    if(!aj.length||JSON.stringify(S)!==before)await saveAll();
    const{data:reps}=await sb.from("profiles").select("empresa_id").eq("role","rep");
    REPS=new Set((reps||[]).map(r=>r.empresa_id));
  }
  setSync("✓ Conectado");
}
/* ---------- Inicio de sesión ---------- */
function showLogin(msg){$("#boot").style.display="none";$("#app").style.display="none";$("#login").style.display="flex";$("#lerr").textContent=msg||"";$("#lbtn").disabled=false}
async function boot(){
  if(!window.supabase||!CFG.SUPABASE_URL||/TU-PROYECTO/.test(CFG.SUPABASE_URL)||!CFG.SUPABASE_ANON_KEY){
    $("#boot").innerHTML=`<div class="lcard"><h1>Planillas Perú</h1><div class="note">Falta configurar la conexión. Edita el archivo <b>config.js</b> con la URL y la clave pública (anon key) de tu proyecto de Supabase.</div></div>`;return}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const{data:{session}}=await sb.auth.getSession();
  if(session)await enter(session.user);else showLogin();
}
async function enter(user){
  ME=user;
  const{data:p,error}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(error||!p){await sb.auth.signOut();return showLogin("Tu usuario no tiene acceso a la aplicación. Comunícate con el administrador.")}
  ROLE=p.role;MYEMP=p.empresa_id;
  document.body.classList.toggle("rep",!isAdmin());
  try{await loadAll()}catch(e){return showLogin("No se pudo cargar la información: "+(e.message||e))}
  if(!isAdmin())empSel=MYEMP;else if(!emp(empSel))empSel=S.empresas[0]?.id||"";
  if(!tabsRol().find(t=>t[0]===tab))tab=isAdmin()?"empresas":"planilla";
  $("#who").textContent=isAdmin()?`Administrador · ${user.email}`:`Representante legal · RUC ${emp(MYEMP)?.ruc||""}`;
  $("#boot").style.display="none";$("#login").style.display="none";$("#app").style.display="";
  render();
}
async function doLogin(ev){
  ev.preventDefault();
  const u=$("#lu").value.trim(),p=$("#lp").value;
  const email=/^\d{11}$/.test(u)?`${u}@${REP_DOMAIN}`:u;
  $("#lbtn").disabled=true;$("#lerr").textContent="";
  const{data,error}=await sb.auth.signInWithPassword({email,password:p});
  if(error){$("#lbtn").disabled=false;$("#lerr").textContent=/invalid/i.test(error.message)?"RUC/correo o contraseña incorrectos.":error.message;return}
  await enter(data.user);
}
async function logout(){try{await sb.auth.signOut()}catch(e){}location.hash="";location.reload()}
function migrate(){
  // asegura que existan campos nuevos si se cargan datos antiguos
  S.config={...clone(DEF.config),...S.config};
  if(!S.config.regimenes||!S.config.regimenes.length)S.config.regimenes=clone(DEF.config.regimenes);
  if(!S.conceptos.find(c=>c.id==="ASIGFAM"))S.conceptos.unshift(clone(DEF.conceptos[0]));
  S.periodos=S.periodos||{};
  // AFP: la comisión mixta fue reemplazada por la comisión anual sobre saldo
  const SALDO={HABITAT:1.25,INTEGRA:0.78,PRIMA:1.25,PROFUTURO:0.68};
  S.afps.forEach(a=>{if(a.comisionSaldo===undefined)a.comisionSaldo=SALDO[a.id]??0;delete a.comisionMixta});
  S.trabajadores.forEach(w=>{if(w.tipoComision==="mixta")w.tipoComision="saldo"});
  // RMV: pasa de valor único a historial con vigencias
  if(!Array.isArray(S.config.rmvHist)||!S.config.rmvHist.length){S.config.rmvHist=clone(DEF.config.rmvHist)}
  if(S.config.rmv!==undefined){const old=num(S.config.rmv);delete S.config.rmv;if(old&&!S.config.rmvHist.some(h=>h.monto===old))S.config.rmvHist.push({desde:"2025-01-01",monto:old})}
  if(!S.config.rmvHist.some(h=>h.monto===1230))S.config.rmvHist.push({desde:"2026-10-01",monto:1230});
  S.config.rmvHist.forEach(h=>{if(h.monto===1230&&h.desde==="2026-11-01")h.desde="2026-10-01"}); // corrección: RMV 1230 rige desde 01/10/2026
  S.config.rmvHist.sort((a,b)=>a.desde.localeCompare(b.desde));
  // Empresas: trabajadores antiguos sin empresa pasan a una empresa creada con los datos previos
  S.empresas=S.empresas||[];
  const sueltos=S.trabajadores.filter(w=>!w.empresaId);
  if(sueltos.length){const E=S.config.empresa||{};
    const e={id:uid(),ruc:E.ruc||"",razon:E.razon||"Empresa sin nombre (edítala)",direccion:E.direccion||"",regimenId:sueltos[0].regimenId||S.config.regimenes[0].id};
    S.empresas.push(e);sueltos.forEach(w=>w.empresaId=e.id)}
  delete S.config.empresa;
  if(!S.empresas.find(e=>e.id===empSel))empSel=S.empresas[0]?.id||"";
}

/* =========================================================
   UTILIDADES
   ========================================================= */
const $=s=>document.querySelector(s);
const r2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const fmt=n=>(+n||0).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const S_=n=>"S/ "+fmt(n);
const num=v=>{const x=parseFloat(String(v).replace(",","."));return isNaN(x)?0:x};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const reg=id=>S.config.regimenes.find(r=>r.id===id)||S.config.regimenes[0];
const emp=id=>S.empresas.find(e=>e.id===id);
const regW=w=>reg(emp(w.empresaId)?.regimenId||w.regimenId);
let empSel=(()=>{try{return localStorage.getItem(LS+"-emp")||""}catch(e){return""}})();
function setEmp(id){empSel=id;try{localStorage.setItem(LS+"-emp",id)}catch(e){};render()}
const trabEmp=()=>S.trabajadores.filter(w=>w.empresaId===empSel);
/** RMV vigente a una fecha (YYYY-MM-DD); por defecto, hoy */
function rmvAt(f){f=f||isoD(new Date());const h=[...S.config.rmvHist].sort((a,b)=>b.desde.localeCompare(a.desde));const x=h.find(r=>r.desde<=f)||h[h.length-1];return x?num(x.monto):0}
const rmvPer=per=>rmvAt(per+"-01");
const afp=id=>S.afps.find(a=>a.id===id);
const nombreT=w=>`${w.apellidos}, ${w.nombres}`;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)}
function parseD(s){if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function isoD(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function lastDay(y,m){return new Date(y,m+1,0).getDate()}
function addMonths(d,n){const y=d.getFullYear(),m=d.getMonth()+n;const t=new Date(y,m,1);t.setDate(Math.min(d.getDate(),lastDay(t.getFullYear(),t.getMonth())));return t}
/** tiempo entre a y b (ambos inclusive) => {a: años, m: meses, d: días} */
function tiempo(a,b){
  if(!a||!b||b<a)return{a:0,m:0,d:0,tm:0};
  const e=new Date(b);e.setDate(e.getDate()+1);
  let m=(e.getFullYear()-a.getFullYear())*12+e.getMonth()-a.getMonth();
  let t=addMonths(a,m); if(t>e){m--;t=addMonths(a,m)}
  const d=Math.round((e-t)/864e5);
  return{a:Math.floor(m/12),m:m%12,d,tm:m};
}

/* =========================================================
   MOTOR DE CÁLCULO
   ========================================================= */
function montoConcepto(c,asig,w,override,rmv){
  if(override!==undefined&&override!==null&&override!=="")return r2(num(override));
  if(c.modo==="porc_rmv")return r2((rmv??rmvAt())*num(c.valor)/100);
  if(c.modo==="porc_sueldo")return r2(num(w.sueldo)*num(c.valor)/100);
  return r2(num(asig&&asig.monto!==undefined&&asig.monto!==""?asig.monto:c.valor));
}
/** Remuneración computable mensual (para beneficios): sueldo + conceptos computables (mes completo) */
function remComputable(w,rmv){
  let rc=num(w.sueldo);
  (w.conceptos||[]).forEach(a=>{const c=S.conceptos.find(x=>x.id===a.id);if(c&&c.tipo==="ingreso"&&c.computable)rc+=montoConcepto(c,a,w,undefined,rmv)});
  return r2(rc);
}
function calcMes(w,per,periodo){
  per=per||{};const cfg=S.config,R=regW(w),rmv=rmvPer(periodo||perSel);
  const dias=Math.max(0,Math.min(30,per.dias===undefined||per.dias===""?30:num(per.dias)));
  const basico=r2(num(w.sueldo)*dias/30);
  const ingresos=[],descuentos=[];
  (w.conceptos||[]).forEach(a=>{
    const c=S.conceptos.find(x=>x.id===a.id);if(!c)return;
    const ov=per.conceptos?per.conceptos[c.id]:undefined;
    const m=montoConcepto(c,a,w,ov,rmv); if(!m)return;
    (c.tipo==="ingreso"?ingresos:descuentos).push({c,m});
  });
  (per.extras||[]).forEach(x=>{
    const m=r2(num(x.monto)); if(!m)return;
    const c={id:"X",nombre:x.nombre||"Eventual",tipo:x.tipo,afectoEssalud:!!x.afecto,afectoPension:!!x.afecto,computable:false};
    (x.tipo==="ingreso"?ingresos:descuentos).push({c,m});
  });
  const sum=(arr,f)=>r2(arr.filter(f||(()=>true)).reduce((s,x)=>s+x.m,0));
  const totalIng=r2(basico+sum(ingresos));
  const baseSalud=r2(basico+sum(ingresos,x=>x.c.afectoEssalud));
  const basePen=r2(basico+sum(ingresos,x=>x.c.afectoPension));
  // Pensiones
  let onp=0,afpAp=0,afpPr=0,afpCo=0,afpN="";
  if(w.pension==="ONP")onp=r2(basePen*cfg.onp/100);
  else if(w.pension==="AFP"){const A=afp(w.afpId);if(A){afpN=A.nombre;
    afpAp=r2(basePen*num(A.aporte)/100);
    afpPr=r2(Math.min(basePen,num(cfg.rma)||Infinity)*num(A.prima)/100);
    // La comisión anual sobre saldo se cobra sobre el fondo acumulado, no sobre la remuneración: descuento mensual = 0
    afpCo=w.tipoComision==="saldo"?0:r2(basePen*num(A.comision)/100);}}
  const pension=r2(onp+afpAp+afpPr+afpCo);
  const quinta=r2(per.quinta===undefined||per.quinta===""?num(w.quinta):num(per.quinta));
  const otrosDesc=sum(descuentos);
  const totalDesc=r2(pension+quinta+otrosDesc);
  const neto=r2(totalIng-totalDesc);
  // Aportes del empleador
  let essalud=0,sis=0;
  if(w.salud==="SIS"&&R.salud==="SIS_O_ESSALUD")sis=r2(num(cfg.sisAporte));
  else essalud=r2(Math.max(baseSalud,rmv*dias/30)*cfg.essalud/100);
  const sctr=w.sctr?r2(baseSalud*num(cfg.sctrTasa)/100):0;
  const vida=R.vidaLey?r2(baseSalud*num(cfg.vidaLeyTasa)/100):0;
  // Provisiones mensuales de beneficios
  const rc=remComputable(w,rmv);
  const provGrati=r2(rc*R.gratiFactor/6);
  const provBonif=r2(provGrati*cfg.bonifExtra/100);
  const provCTS=r2((rc+rc*R.gratiFactor/6)*R.ctsFactor/12);
  const provVac=r2(rc*R.vacDias/30/12);
  const costo=r2(totalIng+essalud+sis+sctr+vida+provGrati+provBonif+provCTS+provVac);
  return{rmv,dias,basico,ingresos,descuentos,totalIng,baseSalud,basePen,onp,afpAp,afpPr,afpCo,afpN,pension,quinta,otrosDesc,totalDesc,neto,essalud,sis,sctr,vida,rc,provGrati,provBonif,provCTS,provVac,costo,R};
}

  return trabEmp().filter(w=>{const fi=parseD(w.fechaIngreso),fc=parseD(w.fechaCese);if(fi&&fi>fin)return false;if(fc&&fc<ini)return false;return w.activo!==false||(fc&&fc>=ini)});
}

  </div>`;

function saveAjuste(wid){
  const f=$("#fa");const p={dias:num(f.dias.value),quinta:f.quinta.value===""?"":r2(num(f.quinta.value)),conceptos:{},extras:extrasTmp.filter(x=>x.nombre||num(x.monto)).map(x=>({...x,monto:r2(num(x.monto))}))};
  f.querySelectorAll(".po").forEach(i=>{if(i.value!=="")p.conceptos[i.dataset.id]=r2(num(i.value))});
  S.periodos[perSel]=S.periodos[perSel]||{};S.periodos[perSel][wid]=p;persist("periodos");closeDlg();vPlan();toast("Ajustes guardados");
}

function csv(rows){return"﻿"+rows.map(r=>r.map(v=>{const s=typeof v==="number"?v.toFixed(2):String(v??"");return/[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}).join(";")).join("\r\n")}
async function exportPlanilla(){

  const rows=[head,...ws.map(w=>{const c=calcMes(w,perData(w.id));return[w.dni,nombreT(w),w.puesto,c.R.nombre,w.pension==="AFP"?c.afpN:w.pension,c.dias,c.basico,r2(c.totalIng-c.basico),c.totalIng,c.baseSalud,c.basePen,c.onp,c.afpAp,c.afpPr,c.afpCo,c.quinta,c.otrosDesc,c.totalDesc,c.neto,c.essalud,c.sis,c.sctr,c.vida,c.provGrati,c.provBonif,c.provCTS,c.provVac,c.costo]})];

async function exportBanco(){

async function descargar(filename,data,type){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Archivo descargado");
}

/* =========================================================
   VISTA: BENEFICIOS SOCIALES
   ========================================================= */
let benW="",benAnio=hoy.getFullYear();
function vBen(){
  const TE=trabEmp();
  if(!TE.length){$("#main").innerHTML=`<div class="card"><div class="empty">Registra trabajadores en esta empresa para calcular sus beneficios.</div></div>`;return}
  if(!TE.find(w=>w.id===benW))benW=TE[0].id;
  const w=TE.find(x=>x.id===benW),R=regW(w),cfg=S.config;
  const rmvB=rmvAt(w.fechaCese||undefined);
  const rc=remComputable(w,rmvB),rd=r2(rc/30);
  const fi=parseD(w.fechaIngreso);
  // ---- Gratificaciones
  const grat=sem=>{
    const y=benAnio,ini=new Date(y,sem?6:0,1),fin=new Date(y,sem?11:5,lastDay(y,sem?11:5));
    let corte=parseD(w.fechaCese);if(!corte||corte>fin)corte=fin;
    let st=ini; if(fi&&fi>ini){st=fi.getDate()===1?fi:new Date(fi.getFullYear(),fi.getMonth()+1,1)}
    let endM=corte.getDate()===lastDay(corte.getFullYear(),corte.getMonth())?corte:new Date(corte.getFullYear(),corte.getMonth(),0);
    let meses=Math.max(0,(endM.getFullYear()-st.getFullYear())*12+endM.getMonth()-st.getMonth()+1); if(st>endM)meses=0; meses=Math.min(6,meses);
    const g=r2(rc*R.gratiFactor*meses/6),b=r2(g*cfg.bonifExtra/100);
    return{meses,g,b,t:r2(g+b)};
  };
  const gJ=grat(0),gD=grat(1);
  // ---- CTS
  const cts=(nov)=>{
    const y=benAnio; const ini=nov?new Date(y,4,1):new Date(y-1,10,1), fin=nov?new Date(y,9,31):new Date(y,3,30);
    let st=fi&&fi>ini?fi:ini; let corte=parseD(w.fechaCese); if(!corte||corte>fin)corte=fin;
    const t=tiempo(st,corte); const meses=Math.min(6,t.tm), dias=t.tm>=6?0:t.d;
    const ultGrati=nov?gJ.g:(()=>{const y0=benAnio;benAnio=y0-1;const x=grat(1);benAnio=y0;return x.g})();
    const rcCts=r2(rc+ultGrati/6);
    const monto=r2((rcCts/12*meses+rcCts/360*dias)*R.ctsFactor);
    return{ini,fin:corte,meses,dias,rcCts,ultGrati,monto};
  };
  const cM=cts(false),cN=cts(true);
  // ---- Vacaciones
  const hoyD=parseD(w.fechaCese)||new Date();
  const tServ=tiempo(fi,hoyD);
  const vacCompleta=r2(rc*R.vacDias/30);
  const vacTruncas=r2(vacCompleta/12*tServ.m+vacCompleta/360*tServ.d);
  // ---- Indemnización
  const fraccion=R.indemFraccion||indemFrac;
  let rdInd=tServ.a*R.indemRD + (fraccion?R.indemRD*tServ.m/12+R.indemRD*tServ.d/360:0);
  const topado=rdInd>R.indemTope; rdInd=Math.min(rdInd,R.indemTope);
  const indem=r2(rd*rdInd);
  const card=(t,body)=>`<div class="card"><h2>${t}</h2>${body}</div>`;
  const tb=rows=>`<table>${rows.map(([l,v,b])=>`<tr><td>${l}</td><td class="n">${b?"<b>"+v+"</b>":v}</td></tr>`).join("")}</table>`;
  $("#main").innerHTML=`
  <div class="card"><div class="row">
    <label>Trabajador<select onchange="benW=this.value;vBen()">${TE.map(x=>`<option value="${x.id}" ${x.id===benW?"selected":""}>${esc(nombreT(x))}</option>`).join("")}</select></label>
    <label>Año<input type="number" value="${benAnio}" style="width:100px" onchange="benAnio=+this.value;vBen()"></label>
    <div><span class="tag">${esc(R.nombre)}</span> <span class="hint">Ingreso: ${esc(w.fechaIngreso||"—")} ${w.fechaCese?"· Cese: "+esc(w.fechaCese):""} · Tiempo de servicios: ${tServ.a} años, ${tServ.m} meses, ${tServ.d} días</span></div>
  </div>
  <p class="hint" style="margin-top:10px">Remuneración computable (sueldo + conceptos computables): <b>${S_(rc)}</b> · Remuneración diaria: <b>${S_(rd)}</b></p></div>
  <div class="cols3">
  ${card("Gratificaciones "+benAnio, R.gratiFactor===0?`<div class="note">El régimen ${esc(R.nombre)} no otorga gratificaciones legales.</div>`:
    `<p class="hint">${R.gratiFactor===1?"Una remuneración":"Media remuneración"} por semestre, proporcional a meses completos + bonificación extraordinaria ${cfg.bonifExtra}% (Ley 30334).</p>`+
    tb([["<b>Julio</b> (ene–jun) · meses completos",gJ.meses],["Gratificación",fmt(gJ.g)],[`Bonificación ${cfg.bonifExtra}%`,fmt(gJ.b)],["Total julio",S_(gJ.t),1],
        ["<b>Diciembre</b> (jul–dic) · meses completos",gD.meses],["Gratificación",fmt(gD.g)],[`Bonificación ${cfg.bonifExtra}%`,fmt(gD.b)],["Total diciembre",S_(gD.t),1]]))}
  ${card("CTS "+benAnio, R.ctsFactor===0?`<div class="note">El régimen ${esc(R.nombre)} no otorga CTS.</div>`:
    `<p class="hint">${R.ctsFactor===1?"RC = sueldo computable + 1/6 de la última gratificación; CTS = RC/12 × meses + RC/360 × días.":"15 remuneraciones diarias por año (50% de la fórmula general), tope 90 RD."}</p>`+
    tb([["<b>Depósito mayo</b> (nov "+(benAnio-1)+" – abr "+benAnio+")",""],["Tiempo computable",`${cM.meses} m, ${cM.dias} d`],["1/6 gratificación diciembre",fmt(cM.ultGrati/6)],["Remuneración computable",fmt(cM.rcCts)],["CTS mayo",S_(cM.monto),1],
        ["<b>Depósito noviembre</b> (may – oct "+benAnio+")",""],["Tiempo computable",`${cN.meses} m, ${cN.dias} d`],["1/6 gratificación julio",fmt(cN.ultGrati/6)],["Remuneración computable",fmt(cN.rcCts)],["CTS noviembre",S_(cN.monto),1]]))}
  ${card("Vacaciones",`<p class="hint">${R.vacDias} días calendario por cada año completo de servicios.</p>`+
    tb([["Días de vacaciones por año",R.vacDias],["Remuneración vacacional (año completo)",S_(vacCompleta),1],[`Vacaciones truncas (${tServ.m} m, ${tServ.d} d desde último aniversario)`,S_(vacTruncas),1]]))}
  ${card("Indemnización por despido arbitrario",`<p class="hint">${R.indemRD} remuneraciones diarias por año ${R.indemFraccion?"(fracciones por dozavos y treintavos)":"completo"}, tope ${R.indemTope} RD.</p>
    ${R.indemFraccion?"":`<label class="chk" style="margin-bottom:8px"><input type="checkbox" ${indemFrac?"checked":""} onchange="indemFrac=this.checked;vBen()"> Incluir fracción de año (proporcional)</label>`}`+
    tb([["Años completos",tServ.a],["Remuneraciones diarias a pagar",fmt(rdInd)+(topado?' <span class="tag warn">tope</span>':"")],["Indemnización",S_(indem),1]]))}
  </div>
  <div class="card"><h2>Resumen anual estimado ${benAnio}</h2>${tb([["Gratificaciones + bonificación",S_(gJ.t+gD.t)],["CTS (mayo + noviembre)",S_(cM.monto+cN.monto)],["Vacaciones (año completo)",S_(vacCompleta)],["Total beneficios",S_(gJ.t+gD.t+cM.monto+cN.monto+vacCompleta),1]])}
  <p class="hint" style="margin-top:8px">Si el trabajador tiene fecha de cese, los cálculos se cortan a esa fecha (truncos). Los resultados son referenciales; valida casos especiales (faltas, licencias sin goce, remuneraciones variables con promedio).</p></div>`;
}

function vConc(){
  $("#main").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Conceptos remunerativos y descuentos</h2>
  <p class="hint">Define qué conceptos son computables para EsSalud, para pensiones (AFP/ONP) y para beneficios sociales (CTS, gratificaciones, vacaciones). Luego asígnalos a cada trabajador.</p></div>

  const H=[...c.rmvHist].map((h,i)=>({...h,i})).sort((a,b)=>b.desde.localeCompare(a.desde));
  const vig=H.find(h=>h.desde<=hoyS);
  $("#main").innerHTML=`<div class="card"><h2>Remuneración Mínima Vital (RMV)</h2>
   <p class="hint">Registra cada RMV con su fecha de vigencia. La planilla de cada mes usa automáticamente la RMV vigente en ese periodo (asignación familiar, base mínima de EsSalud, alertas de sueldo mínimo). Puedes registrar desde ya un aumento futuro.</p>
   <div class="kpis" style="margin-bottom:12px"><div class="kpi"><div class="l">RMV vigente hoy</div><div class="v">${S_(act)}</div></div><div class="kpi"><div class="l">Asignación familiar (10%)</div><div class="v">${S_(act*0.1)}</div></div><div class="kpi"><div class="l">EsSalud mínimo (${c.essalud}%)</div><div class="v">${S_(act*c.essalud/100)}</div></div></div>

   ${H.map(h=>`<tr><td><input type="date" value="${h.desde}" onchange="setRmv(${h.i},'desde',this.value)"></td>
     <td class="n"><input type="number" step="0.01" style="width:120px;text-align:right" value="${h.monto}" onchange="setRmv(${h.i},'monto',num(this.value))"></td>
     <td>${h.desde>hoyS?'<span class="tag warn">Programada</span>':h===vig?'<span class="tag ok">Vigente</span>':'<span class="tag">Histórica</span>'}</td>
     <td>${c.rmvHist.length>1?`<button class="btn sm bad" onclick="S.config.rmvHist.splice(${h.i},1);persist('config');vPar();renderHdr()">Eliminar</button>`:""}</td></tr>`).join("")}
   </tbody></table>
   <div class="row" style="margin-top:10px"><label>Nueva RMV desde<input type="date" id="nrd"></label><label>Monto (S/)<input type="number" step="0.01" id="nrm" style="width:120px"></label><button class="btn pri" onclick="addRmv()">+ Agregar RMV</button></div></div>
  <div class="card"><h2>Otros parámetros legales</h2><p class="hint">Actualízalos cuando cambien por norma. Todos los cálculos se recalculan automáticamente.</p><div class="grid">
   ${inp("UIT (S/)","uit")}
   ${inp("EsSalud (% de la remuneración computable)","essalud")}
   ${inp("ONP (%)","onp")}
   ${inp("Aporte empleador SIS microempresa (S/ mensual)","sisAporte")}
   ${inp("Bonificación extraordinaria Ley 30334 (%)","bonifExtra")}
   ${inp("Tasa Vida Ley (% aprox. según póliza)","vidaLeyTasa","0.001")}
   ${inp("Tasa SCTR (% aprox. según póliza)","sctrTasa","0.001")}
  </div></div>
  <div class="card"><h2>Respaldo de datos</h2><p class="hint">Los datos se guardan automáticamente en tu base de datos de Supabase. Descarga un respaldo periódicamente. Con <b>Restaurar respaldo</b> puedes importar el archivo descargado desde la versión anterior de la app.</p>
   <div class="row"><button class="btn" onclick="descargar('respaldo_planillas.json',JSON.stringify(S,null,1),'application/json')">Descargar respaldo</button>
   <label class="btn" style="flex-direction:row">Restaurar / importar respaldo<input type="file" accept=".json" style="display:none" onchange="restaurar(this.files[0])"></label>
   <button class="btn bad" onclick="confirmar('¿Restablecer parámetros, AFP, regímenes y conceptos a los valores por defecto? (empresas y trabajadores se conservan)',()=>{S.config=clone(DEF.config);S.afps=clone(DEF.afps);S.conceptos=clone(DEF.conceptos);saveAll();render()})">Restablecer valores por defecto</button></div></div>`;
}
function setRmv(i,k,v){if(k==="desde"&&!v)return vPar();if(k==="monto"&&!(v>0))return toast("Monto no válido");S.config.rmvHist[i][k]=v;S.config.rmvHist.sort((a,b)=>a.desde.localeCompare(b.desde));persist("config");vPar();renderHdr();toast("RMV actualizada")}
function addRmv(){const d=$("#nrd").value,m=num($("#nrm").value);if(!d||!(m>0))return toast("Indica fecha y monto");
  const ex=S.config.rmvHist.find(h=>h.desde===d);if(ex)ex.monto=m;else S.config.rmvHist.push({desde:d,monto:m});
  S.config.rmvHist.sort((a,b)=>a.desde.localeCompare(b.desde));persist("config");vPar();renderHdr();toast("RMV registrada")}

  const e=emp(id),tiene=REPS.has(id);
  openDlg(`<h2>Acceso del representante legal</h2>
  <p><b>${esc(e.razon)}</b><br><span class="hint">El representante ingresa con el RUC como usuario. Solo puede ver la información de esta empresa y descargar boletas; no puede modificar nada.</span></p>
  <div class="grid"><label>Usuario (RUC)<input value="${esc(e.ruc)}" disabled></label>
  <label>${tiene?"Nueva contraseña":"Contraseña"} (mín. 8 caracteres)<input id="ap" type="text" minlength="8" autocomplete="off"></label></div>
  <div class="row" style="margin-top:8px"><button class="btn sm" onclick="$('#ap').value=genPass()">Generar contraseña segura</button></div>
  <div id="aerr" class="err" style="margin-top:8px"></div><div id="aok"></div>
  <div class="dlg-foot">${tiene?`<button class="btn bad" style="margin-right:auto" onclick="quitarAcceso('${id}')">Quitar acceso</button>`:""}
  <button class="btn" onclick="closeDlg()">Cerrar</button><button class="btn pri" id="abtn" onclick="guardarAcceso('${id}')">${tiene?"Cambiar contraseña":"Crear acceso"}</button></div>`);
}
async function guardarAcceso(id){
  const pw=$("#ap").value.trim();if(pw.length<8){$("#aerr").textContent="La contraseña debe tener al menos 8 caracteres.";return}
  $("#abtn").disabled=true;$("#aerr").textContent="";
  const{error}=await sb.rpc("admin_set_rep_password",{p_empresa:id,p_password:pw});
  $("#abtn").disabled=false;
  if(error){$("#aerr").textContent=error.message;return}
  REPS.add(id);const e=emp(id);
  const txt=`Acceso a Planillas Perú\nEmpresa: ${e.razon}\nUsuario (RUC): ${e.ruc}\nContraseña: ${pw}\nDirección web: ${location.origin+location.pathname}`;
  $("#aok").innerHTML=`<div class="note info" style="white-space:pre-line">✓ Acceso listo. Entrega estos datos al representante legal:\n\n${esc(txt)}</div><button class="btn sm" id="cpy">Copiar datos</button>`;
  $("#cpy").onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast("Copiado")}catch(x){toast("No se pudo copiar")}};
  vEmp();
}
function quitarAcceso(id){confirmar("¿Quitar el acceso del representante legal? Ya no podrá ingresar a la app.",async()=>{
  const{error}=await sb.rpc("admin_quitar_rep",{p_empresa:id});if(error)return toast(error.message);REPS.delete(id);vEmp();toast("Acceso eliminado")})}

/* =========================================================
   MI CUENTA (cambio de contraseña)
   ========================================================= */
function vCuenta(){
  $("#main").innerHTML=`<div class="card" style="max-width:520px"><h2>Mi cuenta</h2>
  <p class="hint">${isAdmin()?`Administrador: ${esc(ME.email)}`:`Representante legal de <b>${esc(emp(MYEMP)?.razon||"")}</b> · Usuario: RUC ${esc(emp(MYEMP)?.ruc||"")}`}</p>
  <form id="fp" onsubmit="event.preventDefault();cambiarPass()" style="display:flex;flex-direction:column;gap:12px">
   <label>Contraseña actual<input type="password" name="a" autocomplete="current-password" required></label>
   <label>Nueva contraseña (mín. 8 caracteres)<input type="password" name="n" minlength="8" autocomplete="new-password" required></label>
   <label>Repite la nueva contraseña<input type="password" name="r" minlength="8" autocomplete="new-password" required></label>
   <div id="perr" class="err"></div><div><button class="btn pri" id="pbtn">Cambiar contraseña</button></div></form></div>`;
}
async function cambiarPass(){
  const f=$("#fp"),a=f.a.value,n=f.n.value,r=f.r.value;
  if(n.length<8)return $("#perr").textContent="La nueva contraseña debe tener al menos 8 caracteres.";
  if(n!==r)return $("#perr").textContent="Las contraseñas nuevas no coinciden.";
  if(n===a)return $("#perr").textContent="La nueva contraseña debe ser distinta a la actual.";
  $("#pbtn").disabled=true;$("#perr").textContent="";
  const chk=await sb.auth.signInWithPassword({email:ME.email,password:a});
  if(chk.error){$("#pbtn").disabled=false;return $("#perr").textContent="La contraseña actual no es correcta."}
  const{error}=await sb.auth.updateUser({password:n});
  $("#pbtn").disabled=false;
  if(error)return $("#perr").textContent=error.message;
  f.reset();toast("Contraseña actualizada");
}

/* =========================================================
   BOLETAS EN PDF
   ========================================================= */
function drawBoleta(doc,w,c){
  const E=emp(w.empresaId)||{},[y,m]=perSel.split("-").map(Number),R=196,Lx=14;
  doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(E.razon||"",Lx,16,{maxWidth:110});
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(`RUC: ${E.ruc||""}`,Lx,22);if(E.direccion)doc.text(E.direccion,Lx,26,{maxWidth:110});
  doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("BOLETA DE PAGO DE REMUNERACIONES",R,16,{align:"right"});
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(`Periodo: ${MESES[m-1]} ${y}`,R,22,{align:"right"});doc.text("D.S. N° 001-98-TR",R,26,{align:"right"});
  const lab={fontStyle:"bold",fillColor:[240,243,248],cellWidth:34};
  doc.autoTable({startY:31,theme:"grid",styles:{fontSize:8,cellPadding:1.6,textColor:20},columnStyles:{0:lab,2:lab},body:[
    ["Trabajador",nombreT(w),"DNI",w.dni],
    ["Puesto",w.puesto||"","Régimen laboral",c.R.nombre],
    ["Fecha de ingreso",w.fechaIngreso||"","Días laborados",String(c.dias)],
    ["Sistema de pensiones",w.pension==="AFP"?`${c.afpN} (${w.tipoComision==="saldo"?"comisión sobre saldo":"comisión sobre flujo"})`:w.pension==="ONP"?"ONP":"Sin sistema","CUSPP",w.cuspp||"-"],
    ["Banco",w.banco||"-","Cuenta / CCI",[w.cuenta,w.cci].filter(Boolean).join(" / ")||"-"]]});
  const ing=[["Remuneración básica",c.basico],...c.ingresos.map(x=>[x.c.nombre,x.m])];
  const des=[];
  if(c.onp)des.push([`ONP (${S.config.onp}%)`,c.onp]);
  if(c.afpAp)des.push(["AFP – Aporte obligatorio",c.afpAp]);
  if(c.afpPr)des.push(["AFP – Prima de seguro",c.afpPr]);
  if(c.afpCo)des.push(["AFP – Comisión",c.afpCo]);
  if(c.quinta)des.push(["Renta de 5ta categoría",c.quinta]);
  c.descuentos.forEach(x=>des.push([x.c.nombre,x.m]));
  const apo=[];
  if(c.essalud)apo.push([`EsSalud (${S.config.essalud}%)`,c.essalud]);
  if(c.sis)apo.push(["SIS",c.sis]);if(c.sctr)apo.push(["SCTR",c.sctr]);if(c.vida)apo.push(["Vida Ley",c.vida]);
  const n=Math.max(ing.length,des.length,apo.length,1),body=[];
  const cell=(a,i)=>a[i]?[a[i][0],fmt(a[i][1])]:["",""];
  for(let i=0;i<n;i++)body.push([...cell(ing,i),...cell(des,i),...cell(apo,i)]);
  body.push(["TOTAL INGRESOS",fmt(c.totalIng),"TOTAL DESCUENTOS",fmt(c.totalDesc),"TOTAL APORTES",fmt(c.essalud+c.sis+c.sctr+c.vida)]);
  const num_={halign:"right",cellWidth:20};
  doc.autoTable({startY:doc.lastAutoTable.finalY+4,theme:"grid",head:[["INGRESOS","S/","DESCUENTOS","S/","APORTES DEL EMPLEADOR","S/"]],body,
    styles:{fontSize:8,cellPadding:1.6,textColor:20},headStyles:{fillColor:[31,95,191],textColor:255},columnStyles:{1:num_,3:num_,5:num_},
    didParseCell:d=>{if(d.section==="body"&&d.row.index===body.length-1){d.cell.styles.fontStyle="bold";d.cell.styles.fillColor=[240,243,248]}}});
  let yy=doc.lastAutoTable.finalY+9;
  doc.setFillColor(232,240,252);doc.rect(110,yy-6,86,10,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(`NETO A PAGAR: S/ ${fmt(c.neto)}`,R-3,yy,{align:"right"});
  yy+=32;doc.setLineWidth(0.3);doc.line(25,yy,90,yy);doc.line(120,yy,185,yy);
  doc.setFont("helvetica","normal");doc.setFontSize(8);
  doc.text("EMPLEADOR",57.5,yy+4,{align:"center"});doc.text(E.razon||"",57.5,yy+8,{align:"center",maxWidth:70});
  doc.text("TRABAJADOR",152.5,yy+4,{align:"center"});doc.text(`${nombreT(w)} – DNI ${w.dni}`,152.5,yy+8,{align:"center",maxWidth:70});
}
function pdfBoletas(items,filename){
  if(!window.jspdf||!window.jspdf.jsPDF){toast("No se pudo cargar el generador de PDF. Revisa tu conexión.");return}
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  if(typeof doc.autoTable!=="function"){toast("No se pudo cargar el generador de tablas PDF.");return}
  items.forEach(({w,c},i)=>{if(i)doc.addPage();drawBoleta(doc,w,c)});
  doc.save(filename);toast("PDF descargado");
}
function pdfUno(wid){const w=S.trabajadores.find(x=>x.id===wid);pdfBoletas([{w,c:calcMes(w,perData(wid))}],`boleta_${w.dni}_${perSel}.pdf`)}
function pdfTodas(){const ws=trabajadoresDelPeriodo();if(!ws.length)return toast("No hay trabajadores en el periodo");
  pdfBoletas(ws.map(w=>({w,c:calcMes(w,perData(w.id))})),`boletas_${emp(empSel).ruc}_${perSel}.pdf`)}

/* =========================================================
   RESTAURAR RESPALDO (importa al servidor)
   ========================================================= */
function restaurar(file){if(!file)return;const r=new FileReader();r.onload=()=>{
  let o;try{o=JSON.parse(r.result)}catch(e){return toast("Archivo no válido")}
  KEYS.forEach(k=>{if(o[k]!==undefined)S[k]=o[k]});
  if(o.config&&o.config.empresa)S.config.empresa=o.config.empresa;
  migrate();
  const malos=S.empresas.filter(e=>!/^(10|15|16|17|20)\d{9}$/.test(e.ruc||""));
  if(!malos.length){saveAll().then(()=>{render();toast("Respaldo importado")});return}
  openDlg(`<h2>Completa el RUC de estas empresas</h2><p class="hint">Para guardarlas en el servidor cada empresa necesita un RUC válido (11 dígitos).</p>
   ${malos.map(e=>`<div class="grid" style="margin-bottom:8px"><label>Razón social<input class="fr" data-id="${e.id}" value="${esc(e.razon)}"></label><label>RUC<input class="fu" data-id="${e.id}" maxlength="11" value="${esc(e.ruc||"")}"></label></div>`).join("")}
   <div id="rerr" class="err"></div><div class="dlg-foot"><button class="btn pri" id="rok">Importar</button></div>`);
  $("#rok").onclick=()=>{let ok=true;
    document.querySelectorAll(".fu").forEach(i=>{const e=emp(i.dataset.id);e.ruc=i.value.trim();e.razon=document.querySelector(`.fr[data-id="${e.id}"]`).value.trim()||e.razon;
      if(!/^(10|15|16|17|20)\d{9}$/.test(e.ruc)||S.empresas.some(x=>x.id!==e.id&&x.ruc===e.ruc))ok=false});
    if(!ok)return $("#rerr").textContent="Revisa los RUC: deben tener 11 dígitos, empezar con 10, 15, 16, 17 o 20 y no repetirse.";
    closeDlg();saveAll().then(()=>{render();toast("Respaldo importado")})};
};r.readAsText(file)}

boot();
</script>
